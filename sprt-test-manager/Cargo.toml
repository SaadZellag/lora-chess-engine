[package]
name = "sprt-test-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
futures = "0.3"
tempfile = "3"
regex = "1"
dotenv = "0.15"
lazy_static = "1.4"
parking_lot = "0.12"

[dev-dependencies]
